name: jaikalki
description: "Jaikalki School ERP - mobile companion for parents, teachers, students, and staff."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + DI + routing
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.3.0

  # HTTP + storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

  # UX bits the docs call for
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  webview_flutter: ^4.10.0
  google_fonts: ^6.2.1

  # Notifications + payment
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # razorpay_flutter: ^1.3.7
  # local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

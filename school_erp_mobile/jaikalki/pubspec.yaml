name: jaikalki
description: "Jaikalki School ERP - mobile companion for parents, teachers, students, and staff."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0


  cupertino_icons: ^1.0.8

  # State + DI + routing
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  go_router: ^14.3.0

  # HTTP + storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

  # UX bits the docs call for
  cached_network_image: ^3.4.1
  intl: ^0.20.2  # Pinned by flutter_localizations in current Flutter SDK.
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  google_sign_in: ^6.2.1            # "Continue with Google" on login
  # Transport / bus tracking
  google_maps_flutter: ^2.9.0       # Parent map view + admin live fleet
  flutter_background_service: ^5.0.10  # Driver foreground GPS pinger
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  webview_flutter: ^4.10.0
  google_fonts: ^6.2.1

  # Notifications + payment
  #firebase_core: ^3.6.0
  #firebase_messaging: ^15.1.3
  # razorpay_flutter: ^1.3.7
  # local_auth: ^2.3.0
  #flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# Run with: dart run flutter_launcher_icons
# Generates the full Android mipmap set + iOS AppIcon.appiconset from the
# adaptive-icon bundle in Logoes/. The monochrome layer is the Android 13+
# themed icon. The 1024 master (app_icon.png) is the iOS source.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icons/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icons/ic_launcher_monochrome.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FFFCF7"
    theme_color: "#E85D2E"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256
